# 巡回対象サイト一覧
# name: 保存フォルダ名（data/<name>/<取得日>/ に保存される）
# url : PDFリンクを含むページのURL
sites:

  - name: IPA
    url: https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html

  - name: JST
    url: https://www.jst.go.jp/souhatsu/call/index.html

  - name: NEDO
    url: https://www.nedo.go.jp/

  - name: AMED
    url: https://www.amed.go.jp/

# 共通設定（省略時は既定値）
settings:
  timeout: 30              # 通信タイムアウト（秒）
  max_retries: 3           # 通信エラー時の最大試行回数
  request_interval: 1.0    # リクエスト間の待機秒数（サーバ負荷軽減）
  skip_known_urls: true    # 過去に取得済みのURLは再ダウンロードしない
  user_agent: "Mozilla/5.0 (compatible; PdfCollector/1.0)"
